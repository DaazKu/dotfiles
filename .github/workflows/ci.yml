name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Lint shell files
        if: runner.os == 'Linux'
        run: |
          shellcheck -e SC1090,SC1091 -s sh home/.profile home/.config/shell/*.sh home/.local/bin/gh examples/.config/bash/conf.d/*.sh
          shellcheck -e SC1090,SC1091 -s bash home/.bashrc
          for file in home/.zshrc home/.zprofile examples/.config/zsh/conf.d/*.zsh; do zsh -n "$file"; done

      - name: Tests
        working-directory: tests
        run: python3 -m unittest -v

      - name: Real install into a throwaway home
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          ./install --packages
          ./install

      - name: Installed tools work from a login shell
        run: |
          export HOME="$RUNNER_TEMP/home"
          if [ "$RUNNER_OS" = macOS ]; then shell=zsh; else shell=bash; fi
          "$shell" -l -i -c 'set -e
            test "$(command -v gh)" = "$HOME/.local/bin/gh"
            GH_WRAPPER_DEBUG=1 gh --version
            git --version
            tmux -V
            herdr --version' </dev/null
